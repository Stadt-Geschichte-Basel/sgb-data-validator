[project]
name = "sgb-data-validator"
version = "0.1.0"
description = "A data validator for the Stadt-Geschichte-Basel project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.0",
    "omeka-s-client",
    "pydantic>=2.11.9",
    "python-dotenv>=1.0.0",
    "typer>=0.15.0",
]

[project.scripts]
sgb = "sgb_validator.cli:main"

[tool.uv.sources]
omeka-s-client = { git = "https://github.com/maehr/omeka-s-client", rev = "f1b5d66e5d48f2a98eb854fffad52defc778ee5f" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sgb_validator"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = ["N815"]  # Allow mixedCase for API field names

[tool.ruff.lint.per-file-ignores]
"test/*.py" = ["E501"]  # Allow long lines in test files

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[dependency-groups]
docs = ["pandas>=2.2.0", "jupyter>=1.1.1", "tabulate>=0.9.0"]
dev = [
    "ruff>=0.13.2",
    "mypy>=1.14.0",
    "pytest>=8.4.2",
]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.11.5" }

[tool.pytest.ini_options]
testpaths = [
    "test"
]
markers = ["integration: runs against disposable Omeka instances when configured"]
