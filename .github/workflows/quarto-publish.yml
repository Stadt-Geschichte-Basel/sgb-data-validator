on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

name: Render and Publish

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  lint:
    name: Lint with Prettier
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Check for linting errors
        run: npm run check

  python:
    name: Test Python and check types
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests and type checks
        run: |
          uv run --locked --python 3.11 pytest
          uv run --locked --python 3.11 mypy sgb_validator

  build-optimize:
    name: Build, Optimize, and Upload Artifacts
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # with:
        # To install LaTeX to build PDF book outputs, uncomment below
        # tinytex: true
        # uncomment below and fill to pin a version
        # version: SPECIFIC-QUARTO-VERSION-HERE

      # Setup Python for validation report generation
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      - name: Install Python dependencies
        run: |
          uv sync --locked --group docs

      - name: Run validation and generate reports
        env:
          OMEKA_URL: ${{ secrets.OMEKA_URL }}
          ITEM_SET_ID: ${{ secrets.ITEM_SET_ID }}
        run: |
          mkdir -p analysis
          uv run --locked sgb validate \
            --output analysis/validation_report.txt \
            --export-csv \
            --csv-output analysis/
        continue-on-error: true

      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2
        env:
          QUARTO_PYTHON: .venv/bin/python
        with:
          to: sgb-theme-html

      - name: JamPack Optimization
        run: |
          npx @divriots/jampack ./_site

      - name: Upload Built Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: _site

      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v4 # or specific "vX.X.X" version tag for this action
        with:
          path: _site

  deadlinkcheck:
    name: Download Artifacts and Check for Dead Links
    runs-on: ubuntu-latest
    needs: build-optimize

    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v5
        with:
          name: built-site
          path: _site

      - name: Start static server
        run: |
          cd _site
          nohup python3 -m http.server 5528 &
          sleep 3  # Give the server time to start

      - name: Check for broken links
        run: |
          wget --spider --recursive --no-parent --no-check-certificate http://localhost:5528/ || exit 1

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build-optimize, deadlinkcheck]
    if: github.event_name != 'pull_request'

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
